ons.org/licenses/by-sa/4.0","pagina":"https://commons.wikimedia.org/wiki/File:Lemon_balm_plant.jpg","original":"https://upload.wikimedia.org/wikipedia/commons/7/70/Lemon_balm_plant.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-20","alteracao":"Fotografia redimensionada e convertida para WebP; enquadramento ajustado.","ficheiroPequeno":"erva-12-small.webp","largura":960,"larguraPequena":480}},{"id":"erva-13","nome":"Camomila","especie":"Matricaria chamomilla","pagina":"Matricaria chamomilla","grupo":"Infusões","parte":"Capítulos florais","uso":"Compare os nomes científicos no rótulo antes de preparar uma bebida.","cuidado":"Pode causar alergia, sobretudo em pessoas sensíveis a Asteraceae; interações são possíveis.","fonte":5,"resumo":"Infusão tradicional associada ao relaxamento.","beneficios":"A camomila é usada tradicionalmente para relaxamento, conforto digestivo e alguns cuidados da pele. As utilizações abaixo distinguem a tradição da evidência científica; não substituem medicamentos nem acompanhamento médico.","beneficiosDetalhados":[{"titulo":"Stress e ansiedade","texto":"Contém apigenina, um flavonoide estudado pela sua possível ação no sistema nervoso. A camomila é tradicionalmente associada ao relaxamento; os estudos em pessoas com ansiedade são preliminares e não comprovam que uma infusão trate a ansiedade."},{"titulo":"Sono","texto":"É habitual consumir a infusão numa rotina de relaxamento antes de deitar. A evidência disponível é insuficiente para a apresentar como tratamento da insónia ou garantir relaxamento muscular e indução do sono."},{"titulo":"Conforto digestivo","texto":"Algumas preparações medicinais de camomila têm uso tradicional no alívio de gases, distensão abdominal e espasmos intestinais ligeiros. Isso não demonstra que uma infusão caseira trate azia, refluxo ou indigestão persistente."},{"titulo":"Ação anti-inflamatória e alívio da dor","texto":"Alguns constituintes têm atividade anti-inflamatória em estudos laboratoriais. Esses resultados não comprovam que o chá alivie cólicas menstruais, dores musculares ou sintomas de gripe e constipações. O uso tradicional de certas preparações para constipações não equivale a um benefício comprovado da infusão."},{"titulo":"Cuidados com a pele","texto":"Há uso tradicional de preparações próprias para irritações e inflamações ligeiras da pele, incluindo vermelhidão solar. Não há evidência suficiente para recomendar compressas caseiras como tratamento de dermatites, queimaduras solares ou olheiras. Evite aplicações nos olhos; a camomila pode causar irritação e alergia."}],"preparacao":{"titulo":"Infusão de camomila","tipo":"Preparação alimentar para adultos; não é uma dose medicinal","ingredientes":["Capítulos florais de Matricaria chamomilla em produto alimentar identificado, na quantidade indicada na embalagem","Água potável, no volume e à temperatura indicados no rótulo"],"passos":["Confirme a espécie, a parte da planta e os cuidados desta ficha. Use uma chávena e um filtro limpos.","Coloque o produto no filtro e junte a água conforme a embalagem. Tape durante o tempo indicado, sem aumentar a concentração.","Retire o filtro ou coe cuidadosamente. Deixe arrefecer até uma temperatura confortável e prepare apenas para consumo imediato."]},"modoUsar":"Como bebida alimentar ocasional, siga a porção e as instruções da embalagem, de preferência sem açúcar. Esta ficha não define uma frequência diária nem um ciclo de tratamento.","descricao":"Camomila (Matricaria chamomilla): conheça a parte utilizada, a preparação e os cuidados antes de decidir como usar.","cuidadosGerais":"Não substitui medicamentos nem acompanhamento médico. Gravidez, amamentação, infância, doença crónica ou medicação contínua exigem aconselhamento antes de usar plantas com finalidade de saúde. Uma fotografia não confirma a identificação para consumo.","referencias":[5,30,31,1,3],"foto":"assets/plantas/erva-13.jpg","fotoPequena":null,"credito":{"fic 960,"larguraPequena":480}},{"nome":"Mastruz","especie":"Dysphania ambrosioides","aliases":["Erva-de-santa-maria","Chenopodium ambrosioides"],"pagina":"Dysphania ambrosioides","grupo":"Estudo","parte":"Planta para identificação e estudo","descricao":"Planta aromática utilizada historicamente na medicina popular, mas com riscos de toxicidade.","beneficios":"Há registos históricos de usos digestivos e associados a parasitas intestinais. Esses registos não justificam a ingestão doméstica.","cuidado":"Pode ser tóxico, sobretudo em preparações concentradas. Não utilizar como vermífugo caseiro. Não preparar chá, sumo ou óleo para ingestão.","preparacao":{"titulo":"Identificação e cultivo ornamental","tipo":"Sem receita para ingestão","ingredientes":[],"passos":["Confirme a identificação com uma fonte botânica; uma fotografia não basta para autorizar consumo.","Se mantiver a planta como ornamental, identifique o vaso e mantenha-o fora do alcance de crianças e animais.","Não colha para consumo, não prepare chá ou sumo e não utilize óleo como vermífugo."]},"referencias":[23,26,1,0],"id":"erva-38","uso":"Consulte a preparação e as precauções desta ficha.","fonte":23,"resumo":"Identificação e riscos; não preparar para ingestão.","modoUsar":"Não consumir chá, sumo ou óleo de mastruz nem usar como vermífugo caseiro. Esta ficha serve para reconhecer a planta e os seus riscos, sem dose ou modo de ingestão.","cuidadosGerais":"Não substitui medicamentos nem acompanhamento médico. Gravidez, amamentação, infância, doença crónica ou medicação contínua exigem aconselhamento antes de usar plantas com finalidade de saúde. Uma fotografia não confirma a identificação para consumo.","foto":"assets/plantas/erva-38.webp","fotoLargura":960,"fotoPequenaLargura":480,"fotoPequena":"assets/plantas/erva-38-small.webp","credito":{"ficheiro":"erva-38.webp","autor":"\u003ca rel=\"nofollow\" class=\"external text\" href=\"http://www.hear.org/starr/\">Forest &amp; Kim Starr\u003c/a>","licenca":"CC BY 3.0" e a indicação do produto determinam a preparação. Ferver tudo durante muito tempo não torna uma preparação melhor. Não converta quantidades de extratos em colheres de folhas.","passos":["Leia os seis métodos na biblioteca e escolha o adequado ao produto que tem.","Separe utensílios limpos, água potável e a embalagem. Siga as quantidades e o tempo do rótulo, sem aumentar a concentração.","Registe o método, a quantidade indicada e a hora de preparação; descarte se houver alteração de cheiro ou aspeto."],"exemplo":"Infusão alimentar embalada de erva-cidreira: água e tempo conforme embalagem; chávena limpa; consumir após arrefecer o suficiente.","erro":"Usar uma receita de folhas para uma raiz ou para um óleo essencial.","evidencia":"Método escolhido e instrução do rótulo transcrita"},{"id":"m3","titulo":"Ler tradição e evidência","tempo":"7 min","objetivo":"Reconhecer os limites de uma afirmação sobre plantas.","texto":"Uso tradicional descreve uma história de utilização. Um estudo de um extrato específico não prova que uma infusão caseira tem o mesmo efeito. A EMA avalia preparações concretas; o nome da planta, sozinho, não valida todas as utilizações.","passos":["Escolha uma ficha e abra a fonte de consulta.","Separe o que é uso alimentar, tradição e resultado de investigação. Identifique a preparação estudada.","Escreva uma afirmação que não pode concluir a partir daquela fonte."],"exemplo":"Há investigação sobre cápsulas de óleo de hortelã-pimenta. Isso não permite afirmar que o chá cura o refluxo; preparações de hortelã podem até agravá-lo.","erro":"Confundir «natural» com «seguro para qualquer pessoa».","evidencia":"Uma conclusão válida e uma afirmação que a fonte não sustenta"},{"id":"m4","titulo":"Saber quando pedir ajuda","tempo":"8 min","objetivo":"Preparar uma conversa útil com um profissional de saúde.","texto":"Se toma medicamentos, está grávida, amamenta ou tem uma doença crónica, esclareça a compatibilidade antes de usar plantas com finalidade de saúde. Este guia destina-se a adultos e não contém doses pediátricas.","passos":["Abra os temas de consulta e procure a questão que quer esclarecer.","Anote fora da app, para levar à consulta, medicamentos e produtos que utiliza; não suspenda terapêutica prescrita.","Registe aqui apenas a pergunta geral que pretende fazer, sem dados clínicos pessoais."],"exemplo":"«Esta preparação identificada é compatível com a minha medicação?» Levar a embalagem à farmácia.","erro":"Experimentar várias misturas enquanto adia a avaliação de um sintoma persistente.","evidencia":"Pergunta preparada e local de esclarecimento escolhido"},{"id":"m5","titulo":"Montar a sua prateleira","tempo":"10 min","objetivo":"Ter um pequeno conjunto de ervas alimentares bem organizado.","texto":"Poucos produtos identificados são mais úteis do que uma coleção sem rótulos. Separe alimentação, cosméticos e limpeza. Mantenha embalagens e instruções até terminar o produto.","passos":["Faça uma lista de três produtos alimentares que realmente utiliza.","Verifique validade, recipiente, sinais de humidade e exposição ao calor. Siga a conservação da embalagem.","Crie etiquetas com nome, origem e data de abertura; remova produtos sem identificação segura."],"exemplo":"Orégãos: recipiente fechado, armário seco e protegido da luz, data de abertura na etiqueta. Hortelã fresca: conservação conforme indicação do fornecedor.","erro":"Guardar ervas sobre o fogão ou juntar sobras de lotes diferentes.","evidencia":"Três produtos e uma melhoria de conservação realizada"},{"id":"m6","titulo":"Criar uma rotina possível","tempo":"6 min","objetivo":"Repetir uma tarefa simples e rever as suas fichas.","texto":"Aprender sobre ervas é um hábito de observação e organização. O painel acompanha fichas e módulos concluídos; não mede efeitos clínicos nem atribui alterações de saúde a uma planta.","passos":["Escolha um momento da semana para rever a prateleira e as fichas.","Defina uma ação pequena: ler um rótulo, experimentar um tempero alimentar ou preparar uma pergunta.","Escreva dia, ação e critério de conclusão. Exporte as suas fichas para guardar uma cópia."],"exemplo":"Domingo, depois do almoço: conferir três rótulos; concluído quando as datas estiverem legíveis. Exportar as fichas no fim.","erro":"Transformar uma rotina alimentar num tratamento por conta própria.","evidencia":"Dia, ação e critério de conclusão da sua próxima rotina"}],"metodos":[["Infusão","Para produtos alimentares indicados para infusão, normalmente partes delicadas.","1. Confirme espécie, validade e instruções. 2. Coloque a quantidade indicada numa chávena ou filtro limpo. 3. Junte água potável à temperatura indicada, tape se o rótulo recomendar e aguarde o tempo previsto. 4. Coe se necessário e deixe arrefecer antes de beber.","Não há tempo ou dose universal para todas as plantas. Não use plantas de identificação incerta."],["Decocção","Fervura de uma matéria vegetal quando o produto expressamente a prevê.","1. Leia se o produto pede decocção. 2. Meça água e matéria-prima conforme instrução. 3. Use recipiente próprio para alimentos e controle o tempo indicado. 4. Coe com cuidado e deixe arrefecer.","Não concentrar por fervura prolongada nem aplicar este método a qualquer casca ou raiz encontrada."],["Tempero culinário","Ervas alimentares numa refeição habitual.","1. Escolha um produto próprio para alimentação. 2. Lave as ervas frescas segundo indicação do fornecedor. 3. Remova partes deterioradas e talos duros. 4. Junte à receita em pequena quantidade, prove e ajuste o sabor.","A utilização culinária não estabelece uma dose medicinal."],["Bebida de fruta e hortaliça","Uma preparação alimentar para consumo imediato.","1. Lave mãos, utensílios e alimentos. 2. Use água potável, se necessária. 3. Prepare apenas a porção a consumir. 4. Prefira também fruta inteira e refeições com fibra.","Sumos não desintoxicam o organismo nem substituem uma alimentação variada ou medicamentos."],["Compressa e uso externo","Conhecer o limite do autocuidado e as instruções de produtos próprios para a pele.","1. Confirme que o produto é indicado para uso externo. 2. Leia as restrições e verifique a integridade da pele. 3. Use material limpo e temperatura confortável. 4. Interrompa se houver irritação.","Não aplicar preparações caseiras em olhos, feridas abertas, infeções ou queimaduras graves."],["Gargarejo e higiene oral","Apenas produtos especificamente indicados para esse fim.","1. Leia indicação e restrições etárias do produto. 2. Siga a diluição e o tempo da embalagem. 3. Não engula. 4. Dor persistente exige avaliação dentária ou médica.","Infusões, óleos essenciais e extratos não são automaticamente adequados para gargarejar."]],"temas":[{"nome":"Azia","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orientação se persistir. Não procure uma erva para esconder sintomas.","pergunta":"Converse sobre a causa e a compatibilidade de qualquer produto. Na azia, a hortelã pode piorar o desconforto.","fonte":13,"observacao":"Em que momento aparece o ardor e o que estava a comer ou a fazer?"},{"nome":"Refluxo","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orientação se persistir. Não procure uma erva para esconder sintomas.","pergunta":"Converse sobre a causa e a compatibilidade de qualquer produto. Na azia, a hortelã pode piorar o desconforto.","fonte":13,"observacao":"A sensação sobe até à garganta? Em que posições ou horários acontece?"},{"nome":"Enfartamento","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orientação se persistir. Não procure uma erva para esconder sintomas.","pergunta":"Converse sobre a causa e a compatibilidade de qualquer produto. Na azia, a hortelã pode piorar o desconforto.","fonte":13,"observacao":"Depois de que refeições surge a sensação de estar cheio?"},{"nome":"Gases","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orienta
