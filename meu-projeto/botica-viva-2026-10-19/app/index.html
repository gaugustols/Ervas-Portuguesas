parte":"Flores de produto próprio para o uso","uso":"Estude primeiro o rótulo: decoração, cosmético e alimento são categorias diferentes.","cuidado":"Não ingerir óleo essencial; aroma forte pode ser desconfortável e não substitui cuidados de saúde.","fonte":0,"foto":"assets/plantas/erva-28.jpg","credito":{"ficheiro":"erva-28.jpg","autor":"\u003ca href=\"//commons.wikimedia.org/wiki/User:Sten\" title=\"User:Sten\">Sten Porse\u003c/a>","licenca":"CC BY-SA 3.0","licencaUrl":"https://creativecommons.org/licenses/by-sa/3.0/","pagina":"https://commons.wikimedia.org/wiki/File:Lavandula-angustifolia-flowering.JPG","original":"https://upload.wikimedia.org/wikipedia/commons/9/93/Lavandula-angustifolia-flowering.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-19","alteracao":"Redimensionamento automático pelo Wikimedia Commons; enquadramento CSS na aplicação."}},{"id":"erva-29","nome":"Equinácea","especie":"Echinacea purpurea","pagina":"Echinacea purpurea","grupo":"Estudo","parte":"Preparações comerciais identificadas","uso":"Consulte a evidência e a composição do produto antes de considerar qualquer uso.","cuidado":"Possíveis alergias e interações; não usar como substituto de vacinação ou cuidados numa infeção.","fonte":19,"foto":"assets/plantas/erva-29.jpg","credito":{"ficheiro":"erva-29.jpg","autor":"\u003ca href=\"//commons.wikimedia.org/wiki/User:Eric_in_SF\" title=\"User:Eric in SF\">Eric Hunt\u003c/a>","licenca":"CC BY-SA 4.0","licencaUrl":"https://creativecommons.org/licenses/by-sa/4.0","pagina":"https://commons.wikimedia.org/wiki/File:Echinacea_purpurea_Grandview_Prairie.jpg","original":"https://upload.wikimedia.org/wikipedia/commons/8/8e/Echinacea_purpurea_Grandview_Prairie.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-19","alteracao":"Redimensionamento automático pelo Wikimedia Commons; enquadramento CSS na aplicação."}},{"id":"erva-30","nome":"Valeriana","especie":"Valeriana officinalis","pagina":"Valeriana officinalis","grupo":"Estudo","parte":"Raiz em produto regulamentado","uso":"É um tema para conversar com o farmacêutico, não uma receita culinária.","cuidado":"Pode causar sonolência; não combinar por iniciativa própria com sedativos ou álcool.","fonte":18,"foto":"assets/plantas/erva-30.jpg","credito":{"ficheiro":"erva-30.jpg","autor":"\u003cdiv class=\"fn value\">\n\u003ca href=\"//commons.wikimedia.org/wiki/User:Iifar\" title=\"User:Iifar\">Ivar Leidus\u003c/a>\u003c/div>","licenca":"CC BY-SA 4.0","licencaUrl":"https://creativecommons.org/licenses/by-sa/4.0","pagina":"https://commons.wikimedia.org/wiki/File:Valeriana_officinalis_inflorescence_-_Niitv%C3%A4lja.jpg","original":"https://upload.wikimedia.org/wikipedia/commons/a/af/Valeriana_officinalis_inflorescence_-_Niitv%C3%A4lja.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-19","alteracao":"Redimensionamento automático pelo Wikimedia Commons; enquadramento CSS na aplicação."}},{"id":"erva-31","nome":"Hipericão","especie":"Hypericum perforatum","pagina":"Hypericum perforatum","grupo":"Estudo","parte":"Preparações regulamentadas","uso":"Leve o nome e a lista de medicamentos ao farmacêutico antes de ponderar o uso.","cuidado":"Interage com muitos medicamentos, incluindo contracetivos e antidepressivos. Não iniciar nem suspender sozinho.","fonte":17,"foto":"assets/plantas/erva-31.jpg","credito":{"ficheiro":"erva-31.jpg","autor":"\u003cdiv class=\"fn value\">\n\u003ca href=\"//commons.wikimedia.org/wiki/User:Archaeodontosaurus\" title=\"User:Archaeodontosaurus\">Didier Descouens\u003c/a>\u003c/div>","licenca":"CC BY-SA 4.0","licencaUrl":"https://creativecommons.org/licenses/by-sa/4.0","pagina":"https://commons.wikimedia.org/wiki/File:(MHNT)_Hypericum_perforatum_flower_and_buttons.jpg","original":"https://upload.wikimedia.org/wikipedia/commons/c/cf/%28MHNT%29_Hypericum_perforatum_flower_and_buttons.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-19","alteracao":"Redimensionamento automático pelo Wikimedia Commons; enquadramento CSS na aplicação."}},{"id":"erva-32","nome":"Aloé","especie":"Aloe vera","pagina":"Aloe vera","grupo":"Estudo","parte":"Produtos comerciais de uso específico","uso":"Distinga cosmético, gel, látex e folha inteira; não são intercambiáveis.","cuidado":"Não ingerir preparações caseiras da folha ou do látex; não aplicar em queimaduras graves.","fonte":10,"foto":"assets/plantas/erva-32.png","credito":{"ficheiro":"erva-32.png","autor":"Collage by \u003ca href=\"https://en.wikipedia.org/wiki/User:MidgleyDJ\" class=\"extiw\" title=\"en:User:MidgleyDJ\">en:User:MidgleyDJ\u003c/a>, original images from Wikimedia commons (\u003ca href=\"//commons.wikimedia.org/wiki/File:Aloe_vera_offsets.jpg\" title=\"File:Aloe vera offsets.jpg\">Image:Aloe_vera_offsets.jpg\u003c/a> and \u003ca href=\"//commons.wikimedia.org/wiki/File:Aloe_vera_C.jpg\" title=\"File:Aloe vera C.jpg\">Image:Aloe_vera_C.jpg\u003c/a>)","licenca":"CC BY-SA 3.0","licencaUrl":"https://creativecommons.org/licenses/by-sa/3.0","pagina":"https://commons.wikimedia.org/wiki/File:Aloe_vera_flower_inset.png","original":"https://upload.wikimedia.org/wikipedia/commons/4/4b/Aloe_vera_flower_inset.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=original","data":"2026-10-19","alteracao":"Redimensionamento automático pelo Wikimedia Commons; enquadramento CSS na aplicação."}}],"modulos":[{"id":"m1","titulo":"A sua primeira ficha","tempo":"8 min","objetivo":"Sair com uma planta identificada e uma decisão de uso documentada.","texto":"Comece por uma erva alimentar embalada que já conhece. Um nome popular ou uma fotografia não bastam para confirmar uma espécie silvestre. A primeira vitória é saber o que tem nas mãos e quando não usar.","passos":["Leia o nome, a origem e a validade no rótulo. Compare a espécie com a biblioteca.","Escolha uma utilização culinária simples. Se a identificação ou compatibilidade gerar dúvida, registe «não utilizar» e a pergunta para o farmacêutico.","Na ferramenta Ficha prática, guarde a planta, a origem e a decisão. Volte aqui e registe o título da ficha."],"exemplo":"Alecrim alimentar do supermercado, rótulo conservado. Utilização: aromatizar legumes assados. Não usar óleo essencial. Ficha guardada: «Alecrim da cozinha».","erro":"Colher uma planta desconhecida porque se parece com uma fotografia.","evidencia":"Título da ficha guardada e decisão de uso","requerFicha":true},{"id":"m2","titulo":"Preparar com método","tempo":"10 min","objetivo":"Distinguir infusão, decocção e utilização alimentar.","texto":"A parte da planta e a indicação do produto determinam a preparação. Ferver tudo durante muito tempo não torna uma preparação melhor. Não converta quantidades de extratos em colheres de folhas.","passos":["Leia os seis métodos na biblioteca e escolha o adequado ao produto que tem.","Separe utensílios limpos, água potável e a embalagem. Siga as quantidades e o tempo do rótulo, sem aumentar a concentração.","Registe o método, a quantidade indicada e a hora de preparação; descarte se houver alteração de cheiro ou aspeto."],"exemplo":"Infusão alimentar embalada de erva-cidreira: água e tempo conforme embalagem; chávena limpa; consumir após arrefecer o suficiente.","erro":"Usar uma receita de folhas para uma raiz ou para um óleo essencial.","evidencia":"Método escolhido e instrução do rótulo transcrita"},{"id":"m3","titulo":"Ler tradição e evidência","tempo":"7 min","objetivo":"Reconhecer os limites de uma afirmação sobre plantas.","texto":"Uso tradicional descreve uma história de utilização. Um estudo de um extrato específico não prova que uma infusão caseira tem o mesmo efeito. A EMA avalia preparações concretas; o nome da planta, sozinho, não valida todas as utilizações.","passos":["Escolha uma ficha e abra a fonte de consulta.","Separe o que é uso alimentar, tradição e resultado de investigação. Identifique a preparação estudada.","Escreva uma afirmação que não pode concluir a partir daquela fonte."],"exemplo":"Há investigação sobre cápsulas de óleo de hortelã-pimenta. Isso não permite afirmar que o chá cura o refluxo; preparações de hortelã podem até agravá-lo.","erro":"Confundir «natural» com «seguro para qualquer pessoa».","evidencia":"Uma conclusão válida e uma afirmação que a fonte não sustenta"},{"id":"m4","titulo":"Saber quando pedir ajuda","tempo":"8 min","objetivo":"Preparar uma conversa útil com um profissional de saúde.","texto":"Se toma medicamentos, está grávida, amamenta ou tem uma doença crónica, esclareça a compatibilidade antes de usar plantas com finalidade de saúde. Este guia destina-se a adultos e não contém doses pediátricas.","passos":["Abra os temas de consulta e procure a questão que quer esclarecer.","Anote fora da app, para levar à consulta, medicamentos e produtos que utiliza; não suspenda terapêutica prescrita.","Registe aqui apenas a pergunta geral que pretende fazer, sem dados clínicos pessoais."],"exemplo":"«Esta preparação identificada é compatível com a minha medicação?» Levar a embalagem à farmácia.","erro":"Experimentar várias misturas enquanto adia a avaliação de um sintoma persistente.","evidencia":"Pergunta preparada e local de esclarecimento escolhido"},{"id":"m5","titulo":"Montar a sua prateleira","tempo":"10 min","objetivo":"Ter um pequeno conjunto de ervas alimentares bem organizado.","texto":"Poucos produtos identificados são mais úteis do que uma coleção sem rótulos. Separe alimentação, cosméticos e limpeza. Mantenha embalagens e instruções até terminar o produto.","passos":["Faça uma lista de três produtos alimentares que realmente utiliza.","Verifique validade, recipiente, sinais de humidade e exposição ao calor. Siga a conservação da embalagem.","Crie etiquetas com nome, origem e data de abertura; remova produtos sem identificação segura."],"exemplo":"Orégãos: recipiente fechado, armário seco e protegido da luz, data de abertura na etiqueta. Hortelã fresca: conservação conforme indicação do fornecedor.","erro":"Guardar ervas sobre o fogão ou juntar sobras de lotes diferentes.","evidencia":"Três produtos e uma melhoria de conservação realizada"},{"id":"m6","titulo":"Criar uma rotina possível","tempo":"6 min","objetivo":"Repetir uma tarefa simples e rever as suas fichas.","texto":"Aprender sobre ervas é um hábito de observação e organização. O painel acompanha fichas e módulos concluídos; não mede efeitos clínicos nem atribui alterações de saúde a uma planta.","passos":["Escolha um momento da semana para rever a prateleira e as fichas.","Defina uma ação pequena: ler um rótulo, experimentar um tempero alimentar ou preparar uma pergunta.","Escreva dia, ação e critério de conclusão. Exporte as suas fichas para guardar uma cópia."],"exemplo":"Domingo, depois do almoço: conferir três rótulos; concluído quando as datas estiverem legíveis. Exportar as fichas no fim.","erro":"Transformar uma rotina alimentar num tratamento por conta própria.","evidencia":"Dia, ação e critério de conclusão da sua próxima rotina"}],"metodos":[["Infusão","Para produtos alimentares indicados para infusão, normalmente partes delicadas.","1. Confirme espécie, validade e instruções. 2. Coloque a quantidade indicada numa chávena ou filtro limpo. 3. Junte água potável à temperatura indicada, tape se o rótulo recomendar e aguarde o tempo previsto. 4. Coe se necessário e deixe arrefecer antes de beber.","Não há tempo ou dose universal para todas as plantas. Não use plantas de identificação incerta."],["Decocção","Fervura de uma matéria vegetal quando o produto expressamente a prevê.","1. Leia se o produto pede decocção. 2. Meça água e matéria-prima conforme instrução. 3. Use recipiente próprio para alimentos e controle o tempo indicado. 4. Coe com cuidado e deixe arrefecer.","Não concentrar por fervura prolongada nem aplicar este método a qualquer casca ou raiz encontrada."],["Tempero culinário","Ervas alimentares numa refeição habitual.","1. Escolha um produto próprio para alimentação. 2. Lave as ervas frescas segundo indicação do fornecedor. 3. Remova partes deterioradas e talos duros. 4. Junte à receita em pequena quantidade, prove e ajuste o sabor.","A utilização culinária não estabelece uma dose medicinal."],["Bebida de fruta e hortaliça","Uma preparação alimentar para consumo imediato.","1. Lave mãos, utensílios e alimentos. 2. Use água potável, se necessária. 3. Prepare apenas a porção a consumir. 4. Prefira também fruta inteira e refeições com fibra.","Sumos não desintoxicam o organismo nem substituem uma alimentação variada ou medicamentos."],["Compressa e uso externo","Conhecer o limite do autocuidado e as instruções de produtos próprios para a pele.","1. Confirme que o produto é indicado para uso externo. 2. Leia as restrições e verifique a integridade da pele. 3. Use material limpo e temperatura confortável. 4. Interrompa se houver irritação.","Não aplicar preparações caseiras em olhos, feridas abertas, infeções ou queimaduras graves."],["Gargarejo e higiene oral","Apenas produtos especificamente indicados para esse fim.","1. Leia indicação e restrições etárias do produto. 2. Siga a diluição e o tempo da embalagem. 3. Não engula. 4. Dor persistente exige avaliação dentária ou médica.","Infusões, óleos essenciais e extratos não são automaticamente adequados para gargarejar."]],"temas":[{"nome":"Azia","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orientação se persistir. Não procure uma erva para esconder sintomas.","pergunta":"Converse sobre a causa e a compatibilidade de qualquer produto. Na azia, a hortelã pode piorar o desconforto.","fonte":13,"observacao":"Em que momento aparece o ardor e o que estava a comer ou a fazer?"},{"nome":"Refluxo","grupo":"Digestão","orientacao":"Registe quando começou e a relação com alimentos; peça orientação se persistir. Não procure uma erva para esconder sintomas.","pergunta":"
