<svg xmlns="http://www.w3.org/2000/svg" width="440" height="560" viewBox="0 0 440 560" role="img" aria-labelledby="title desc">
<title id="title">O teu percurso no Botica Viva</title><desc id="desc">Explora as plantas, conhece as preparações e consulta o guia ao teu ritmo.</desc>
<rect width="440" height="560" rx="20" fill="#f1f8f3"/>
<rect x="16" y="16" width="408" height="528" rx="14" fill="none" stroke="#cde3d4"/>
<text x="38" y="64" fill="#486553" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">BOTICA VIVA · GUIA DIGITAL</text>
<text x="38" y="110" fill="#103d2a" font-family="Georgia,serif" font-size="31">O teu percurso</text>
<path d="M61 169V422" stroke="#cde3d4" stroke-width="2"/>
<g transform="translate(0 0)"><circle cx="61" cy="174" r="23" fill="#166534"/><text x="61" y="179" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">01</text><text x="101" y="179" fill="#103d2a" font-family="Georgia,serif" font-size="25">Explora</text><text x="101" y="208" fill="#486553" font-family="Arial,sans-serif" font-size="16">As plantas e os seus</text><text x="101" y="232" fill="#486553" font-family="Arial,sans-serif" font-size="16">usos tradicionais.</text></g>
<g transform="translate(0 130)"><circle cx="61" cy="174" r="23" fill="#166534"/><text x="61" y="179" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">02</text><text x="101" y="179" fill="#103d2a" font-family="Georgia,serif" font-size="25">Conhece</text><text x="101" y="208" fill="#486553" font-family="Arial,sans-serif" font-size="16">As formas de preparação</text><text x="101" y="232" fill="#486553" font-family="Arial,sans-serif" font-size="16">e os cuidados a ter.</text></g>
<g transform="translate(0 260)"><circle cx="61" cy="174" r="23" fill="#166534"/><text x="61" y="179" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="13" font-weight="700">03</text><text x="101" y="179" fill="#103d2a" font-family="Georgia,serif" font-size="25">Consulta</text><text x="101" y="208" fill="#486553" font-family="Arial,sans-serif" font-size="16">O guia ao teu ritmo,</text><text x="101" y="232" fill="#486553" font-family="Arial,sans-serif" font-size="16">sempre que quiseres.</text></g>
</svg>
